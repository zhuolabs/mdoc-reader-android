[package]
name = "mdoc-android"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
anyhow.workspace = true
uniffi.workspace = true
mdoc-core.workspace = true
mdoc-reader-flow.workspace = true
mdoc-security.workspace = true
mdoc-ui.workspace = true
mdoc-android-platform.workspace = true
nfc-reader-android = { path = "../nfc-reader-android" }
mdoc-transport-ble-android = { path = "../mdoc-transport-ble-android" }
mdoc-ui-android = { path = "../mdoc-ui-android" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
