[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
mdoc-core = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-ui = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
nfc-reader = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-transport = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-reader-flow = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-data-retrieval-flow = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-security = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "bc973b1d1b58da55f3c99779b72f7e951e7911ef" }
mdoc-android-platform = { path = "crates/mdoc-android-platform" }
uniffi = { version = "=0.32.0" }

[profile.release]
lto = "thin"
strip = "debuginfo"
