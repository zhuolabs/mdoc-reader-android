[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
mdoc-reader-ffi = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "7587ba7e02daa362b3d5bb54d7921572aac139d4" }
mdoc-transport-ble = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "7587ba7e02daa362b3d5bb54d7921572aac139d4", features = ["uniffi"] }
nfc-reader = { git = "https://github.com/zhuolabs/mdoc-reader", rev = "7587ba7e02daa362b3d5bb54d7921572aac139d4", features = ["uniffi"] }
mdoc-android-platform = { path = "crates/mdoc-android-platform" }
uniffi = { version = "=0.32.0" }

[profile.release]
lto = "thin"
strip = "debuginfo"
